# RootlessWM settings example.
# Copy this file to %LOCALAPPDATA%\RootlessWM\settings.toml and edit to taste.
# All keys are optional; omitted keys fall back to their defaults.

master-ratio = 0.6
outer-gap = 8
inner-gap = 8
layout = "MasterLeft"
master-count = 1

# The bar is an ordered set of styled sections.
[statusbar]
visible = true
height = 28
# Colors support #RRGGBB (opaque) and #RRGGBBAA (alpha). 00 is transparent; FF is opaque.
background = "#1e1e2e"
border = { width = 1, color = "#45475a" }
radius = 6
padding = { top = 2, right = 8, bottom = 2, left = 8 }
spacing = 6
font = { family = "Cascadia Mono", size = 12, weight = "bold" }

[[statusbar.sections]]
id = "workspaces"
align = "left"
background = "#313244"
padding = { left = 4, right = 4 }

[[statusbar.sections]]
id = "layout"
align = "left"

[[statusbar.sections]]
id = "title"
align = "center"
color = "#cdd6f4"
# background = "#1e1e2ec0" # 75% opaque: windows behind this section show through.
max-width = 700

[[statusbar.sections]]
id = "widgets"
align = "right"
widgets = ["cpu", "memory", "clock"]

[statusbar.workspaces]
background = "#313244"
color = "#cdd6f4"
current-background = "#cba6f7"
current-color = "#1e1e2e"
symbols = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]

[statusbar.layout]
background = "#1e1e2e"
color = "#cdd6f4"

[statusbar.layout.symbols]
MasterLeft = "ML"
MasterTop = "MT"
monocle = "MON"
floating = "FLT"

[statusbar.title]
background = "#1e1e2e"
current-background = "#1e1e2e"
current-color = "#cdd6f4"

# Each widget is a record. IDs are used by section widgets lists.
[[statusbar.widgets]]
id = "cpu"
kind = "cpu"
symbol = "CPU"
symbol-color = "#f38ba8"
color = "#cdd6f4"
background = "#1e1e2e"
padding = { left = 4, right = 4 }

[[statusbar.widgets]]
id = "memory"
kind = "memory"
symbol = "MEM"
symbol-color = "#fab387"
color = "#cdd6f4"
background = "#1e1e2e"
padding = { left = 4, right = 4 }

[[statusbar.widgets]]
id = "clock"
kind = "clock"
color = "#cdd6f4"
background = "#1e1e2e"
padding = { left = 4, right = 4 }

# Built-in widget reference
# Uncomment a record and add its ID to the widgets section above.
# Available kinds: cpu, memory, clock, date, uptime, battery, disk, network, text.

