# Built-in app runner configuration.
# This is the first integration point for a rofi-like shell launcher that searches
# installed apps and executable paths without requiring per-entry config.
[runner]
enabled = true
max-results = 8
matching = "fuzzy"
sources = ["start-menu", "app-paths", "path"]

[runner.window]
position = "top-center"
offset-x = 0
offset-y = 96
width = 720
max-height = 560

[runner.style]
# Runner colors accept #RRGGBB and #RRGGBBAA; AA is opacity (00 transparent, FF opaque).
background = "#1e1e2eeF"
color = "#cdd6f4"
border-color = "#45475aCC"
border-width = 1
radius = 6
font-family = "Cascadia Mono"
font-size = 12

[runner.input]
prompt = "run"
background = "#313244F2"
color = "#cdd6f4"
placeholder-color = "#6c7086"
height = 36

[runner.results]
row-height = 40
spacing = 4
background = "#1e1e2eCC"
color = "#cdd6f4"
selected-background = "#cba6f7F2"
selected-color = "#1e1e2e"
secondary-color = "#a6adc8"

[runner.icons]
# Draw the associated Windows icon for each result.
visible = true
size = 24
padding = 8

[Hotkeys]
OpenRunner = "Alt+P"
PromoteToMaster = "Alt+M"
FocusNext = "Alt+J"
FocusPrevious = "Alt+K"
SelectWorkspace1 = "Alt+1"
SelectWorkspace2 = "Alt+2"
SelectWorkspace3 = "Alt+3"
SelectWorkspace4 = "Alt+4"
SelectWorkspace5 = "Alt+5"
SelectWorkspace6 = "Alt+6"
SelectWorkspace7 = "Alt+7"
SelectWorkspace8 = "Alt+8"
SelectWorkspace9 = "Alt+9"
MoveToWorkspace1 = "Alt+Shift+1"
MoveToWorkspace2 = "Alt+Shift+2"
MoveToWorkspace3 = "Alt+Shift+3"
MoveToWorkspace4 = "Alt+Shift+4"
MoveToWorkspace5 = "Alt+Shift+5"
MoveToWorkspace6 = "Alt+Shift+6"
MoveToWorkspace7 = "Alt+Shift+7"
MoveToWorkspace8 = "Alt+Shift+8"
MoveToWorkspace9 = "Alt+Shift+9"
IncreaseMasterRatio = "Alt+L"
DecreaseMasterRatio = "Alt+H"
IncreaseMasterCount = "Alt+I"
DecreaseMasterCount = "Alt+D"
IncreaseOuterGap = "Alt+O"
DecreaseOuterGap = "Alt+U"
IncreaseInnerGap = "Alt+Shift+O"
DecreaseInnerGap = "Alt+Shift+U"
FocusNextMonitor = "Alt+Shift+L"
FocusPreviousMonitor = "Alt+Shift+H"
MoveToNextMonitor = "Alt+Ctrl+L"
MoveToPreviousMonitor = "Alt+Ctrl+H"
CycleLayout = "Alt+Space"
MaximizeWindow = "Alt+Shift+F"
ToggleFloating = "Alt+F"
SwapWithNext = "Alt+Shift+J"
SwapWithPrevious = "Alt+Shift+K"
Close = "Alt+Q"
ToggleExplorer = "Alt+E"
