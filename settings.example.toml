# RootlessWM settings example.
# Copy this file to %LOCALAPPDATA%\RootlessWM\settings.toml and edit to taste.
# All keys are optional; omitted keys fall back to their defaults.

master-ratio = 0.6
outer-gap = 8
inner-gap = 8
layout = "MasterLeft"
master-count = 1

# Controls what Alt+E / ToggleExplorer hides while Explorer keeps running.
# Options:
# - TaskbarOnly: hide taskbars only; wallpaper and desktop icons remain visible.
# - TaskbarAndDesktopIcons: hide taskbars and desktop icons; wallpaper remains visible.
# - TaskbarWallpaperAndDesktopIcons: hide taskbars plus Progman; wallpaper and desktop icons disappear.
toggle-explorer-behaviour = "TaskbarOnly"

# When true, applies toggle-explorer-behaviour immediately on startup so the WM
# starts with Explorer chrome already hidden (Alt+E / ToggleExplorer un-hides it).
hide-explorer-on-start = false

# Process names (no .exe suffix) to leave floating instead of tiling.
# Useful for windows that auto-elevate (e.g. Task Manager on Windows 11): a non-elevated
# RootlessWM cannot reposition them, so excluding them here avoids the wasted retile attempts.
excluded-executables = ["Taskmgr"]

[statusbar]
visible = true
height = 28
# Colors support #RRGGBB (opaque) and #RRGGBBAA (alpha). 00 is transparent; FF is opaque.
background = "#1e1e2e"
color = "#cdd6f4"
border = { width = 1, color = "#45475a" }
radius = 6
padding = { top = 2, right = 8, bottom = 2, left = 8 }
spacing = 6
font = { family = "Cascadia Mono", size = 12, weight = "bold" }
modules-left = ["workspaces", "layout"]
modules-center = ["window-title"]
modules-right = ["cpu", "memory", "clock"]

[module.workspaces]
type = "workspaces"
labels = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]
active-bg = "#cba6f7"
active-fg = "#1e1e2e"
background = "#313244"
padding = { left = 4, right = 4 }

[module.layout]
type = "layout"
symbols = { MasterLeft = "ML", MasterTop = "MT", monocle = "MON", floating = "FLT" }

[module.window-title]
type = "window-title"
monitor = "focused"
max-width = 700
color = "#a6adc8"

[module.cpu]
type = "cpu"
monitor = "primary"
format = "CPU {percent}%"
interval-ms = 2000
background = "#181825"
border = { width = 1, color = "#f38ba8" }
radius = 6
padding = { left = 6, right = 6 }
margin = { left = 4 }

[module.memory]
type = "memory"
monitor = "primary"
# Module format supports inline styling tags: [c=color s=size w=weight f=family]...[/]
# format = "[c=#89b4fa s=14 w=bold]MEM[/] {used_percent}%"
format = "MEM {used_percent}%"
color = "#fab387"

[module.clock]
type = "clock"
monitor = "primary"
format = "{:%H:%M:%S}"
font = { family = "Cascadia Mono", size = 13, weight = "normal" }

# Data modules support type-specific format placeholders documented in README.md.
# Built-in data types: date, uptime, battery, disk, and network.
# Battery symbols can represent charge state and charging.
# [module.battery]
# type = "battery"
# format = "{battery_symbol} {percent}%{charging}"
# symbols = { charging = "CHG", batteryEmpty = "", batteryQuarter = "", batteryHalf = "", batteryThreeQuarters = "", batteryFull = "" }
# Example literal text module (no format property):
# [module.separator]
# type = "text"
# text = " | "

# Example command module. Command supports format = "VPN {output}".
# [module.vpn]
# type = "command"
# command = "powershell -NoProfile -Command \"(Get-NetAdapter | Where-Object Status -eq 'Up').Name\""
# interval-ms = 5000
# format = "VPN {output}"
# color = "#a6e3a1"

# Built-in app runner configuration.
# This is the first integration point for a rofi-like shell launcher that searches
# installed apps and executable paths without requiring per-entry config.
[runner]
enabled = true
max-results = 8
matching = "fuzzy"
sources = ["start-menu", "app-paths", "path"]

[runner.window]
position = "top-center"
offset-x = 0
offset-y = 96
width = 720
max-height = 560

[runner.style]
# Runner colors accept #RRGGBB and #RRGGBBAA; AA is opacity (00 transparent, FF opaque).
background = "#1e1e2eeF"
color = "#cdd6f4"
border-color = "#45475aCC"
border-width = 1
radius = 6
font-family = "Cascadia Mono"
font-size = 12

[runner.input]
prompt = "run"
background = "#313244F2"
color = "#cdd6f4"
placeholder-color = "#6c7086"
height = 36

[runner.results]
row-height = 40
spacing = 4
background = "#1e1e2eCC"
color = "#cdd6f4"
selected-background = "#cba6f7F2"
selected-color = "#1e1e2e"
secondary-color = "#a6adc8"

[runner.icons]
# Draw the associated Windows icon for each result.
visible = true
size = 24
padding = 8

[Hotkeys]
OpenRunner = "Alt+P"
PromoteToMaster = "Alt+M"
FocusNext = "Alt+J"
FocusPrevious = "Alt+K"
SelectWorkspace1 = "Alt+1"
SelectWorkspace2 = "Alt+2"
SelectWorkspace3 = "Alt+3"
SelectWorkspace4 = "Alt+4"
SelectWorkspace5 = "Alt+5"
SelectWorkspace6 = "Alt+6"
SelectWorkspace7 = "Alt+7"
SelectWorkspace8 = "Alt+8"
SelectWorkspace9 = "Alt+9"
MoveToWorkspace1 = "Alt+Shift+1"
MoveToWorkspace2 = "Alt+Shift+2"
MoveToWorkspace3 = "Alt+Shift+3"
MoveToWorkspace4 = "Alt+Shift+4"
MoveToWorkspace5 = "Alt+Shift+5"
MoveToWorkspace6 = "Alt+Shift+6"
MoveToWorkspace7 = "Alt+Shift+7"
MoveToWorkspace8 = "Alt+Shift+8"
MoveToWorkspace9 = "Alt+Shift+9"
IncreaseMasterRatio = "Alt+L"
DecreaseMasterRatio = "Alt+H"
IncreaseMasterCount = "Alt+I"
DecreaseMasterCount = "Alt+D"
IncreaseOuterGap = "Alt+O"
DecreaseOuterGap = "Alt+U"
IncreaseInnerGap = "Alt+Shift+O"
DecreaseInnerGap = "Alt+Shift+U"
FocusNextMonitor = "Alt+Shift+L"
FocusPreviousMonitor = "Alt+Shift+H"
MoveToNextMonitor = "Alt+Ctrl+L"
MoveToPreviousMonitor = "Alt+Ctrl+H"
CycleLayout = "Alt+Space"
MaximizeWindow = "Alt+Shift+F"
ToggleFloating = "Alt+F"
SwapWithNext = "Alt+Shift+J"
SwapWithPrevious = "Alt+Shift+K"
Close = "Alt+Q"
ToggleExplorer = "Alt+E"
ToggleStatusBar = "Alt+B"
